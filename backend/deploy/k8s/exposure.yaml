# Public HTTPS exposure via Cloudflare Tunnel (recommended for this cluster:
# no ingress controller / no cert-manager needed, no port forwarding, TLS at
# Cloudflare). Prereqs: a Cloudflare account + a domain on it.
#   1. cloudflared tunnel create lianliankan
#   2. put the tunnel token below (or into a Secret and reference it)
#   3. route the tunnel: cloudflared tunnel route dns lianliankan api.<your-domain>
# The game then sets server_sync.DEFAULT_API_BASE to https://api.<your-domain>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: lianliankan
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              value: "REPLACE_WITH_TUNNEL_TOKEN"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
# HTTP-only fallback for same-LAN play while no public domain exists.
# NOTE: the GitHub Pages build is HTTPS, so browsers block calls to this from
# the Pages build; usable only from an HTTP-hosted page or curl testing.
apiVersion: v1
kind: Service
metadata:
  name: lianliankan-backend-nodeport
  namespace: lianliankan
spec:
  type: NodePort
  selector:
    app: lianliankan-backend
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30800
