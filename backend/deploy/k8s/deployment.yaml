apiVersion: apps/v1
kind: Deployment
metadata:
  name: lianliankan-backend
  namespace: lianliankan
  labels:
    app: lianliankan-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lianliankan-backend
  template:
    metadata:
      labels:
        app: lianliankan-backend
    spec:
      containers:
        - name: api
          image: 192.168.1.83:30050/tradermoney/lianliankan-backend:v2
          # Harbor (192.168.1.83:30050) is the canonical home for this image;
          # while Harbor is down the image is pre-imported into both nodes'
          # containerd (ctr -n k8s.io images import), so keep IfNotPresent.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
