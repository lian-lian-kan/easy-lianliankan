services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lianlian
      POSTGRES_PASSWORD: lianlian
      POSTGRES_DB: lianlian
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lianlian"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://lianlian:lianlian@db:5432/lianlian
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
