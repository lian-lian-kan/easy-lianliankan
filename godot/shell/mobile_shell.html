<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	overflow: hidden;
	overscroll-behavior: none;
	-webkit-text-size-adjust: 100%;
	text-size-adjust: 100%;
}

body {
	color: white;
	background: linear-gradient(135deg, #ffd6e8 0%, #f3e8ff 100%);
	background-color: #ffd6e8;
	box-sizing: border-box;
	padding:
		env(safe-area-inset-top)
		env(safe-area-inset-right)
		env(safe-area-inset-bottom)
		env(safe-area-inset-left);
	touch-action: manipulation;
}

#canvas {
	display: block;
	width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
	height: calc(var(--app-height, 100dvh) - env(safe-area-inset-top) - env(safe-area-inset-bottom));
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background: linear-gradient(135deg, #ffd6e8 0%, #f3e8ff 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	overflow: hidden;
}

.loading-title {
	font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
	font-size: 1.6rem;
	font-weight: 700;
	color: #d6336c;
	letter-spacing: 0.12em;
	margin-bottom: 1.2rem;
	text-shadow: 0 1px 0 #ffffff;
}

.loading-hint {
	font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
	font-size: 0.85rem;
	color: #a2637f;
	margin-top: 0.9rem;
}

.petal-field {
	position: absolute;
	inset: 0;
	pointer-events: none;
}

.petal-field span {
	position: absolute;
	top: -8vh;
	font-size: 1.1rem;
	opacity: 0.75;
	animation: petal-fall linear infinite;
}

.petal-field span:nth-child(1) { left: 8%;  animation-duration: 9s;  animation-delay: 0s;   font-size: 1.3rem; }
.petal-field span:nth-child(2) { left: 24%; animation-duration: 12s; animation-delay: -3s; }
.petal-field span:nth-child(3) { left: 42%; animation-duration: 10s; animation-delay: -6s; font-size: 1.5rem; }
.petal-field span:nth-child(4) { left: 61%; animation-duration: 13s; animation-delay: -1.5s; }
.petal-field span:nth-child(5) { left: 76%; animation-duration: 9.5s; animation-delay: -4.5s; font-size: 1.4rem; }
.petal-field span:nth-child(6) { left: 90%; animation-duration: 11s; animation-delay: -8s; }

@keyframes petal-fall {
	0%   { transform: translateY(0) rotate(0deg); }
	100% { transform: translateY(115vh) rotate(340deg); }
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
	height: 0.9rem;
	border: 0;
	border-radius: 999px;
	overflow: hidden;
	background: rgba(255, 255, 255, 0.75);
	-webkit-appearance: none;
	appearance: none;
}

#status-progress::-webkit-progress-bar {
	background: rgba(255, 255, 255, 0.75);
	border-radius: 999px;
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #f783ac, #e64980);
	border-radius: 999px;
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #f783ac, #e64980);
	border-radius: 999px;
}

#status-notice {
	background-color: #fff0f6;
	border-radius: 0.75rem;
	border: 1px solid #f09ebb;
	color: #6b4a5e;
	font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

.status-action {
	background: #f06ba8;
	color: #ffffff;
	border: 0;
	border-radius: 999px;
	font-size: 0.95rem;
	font-weight: 600;
	line-height: 1;
	margin-top: 0.75rem;
	padding: 0.6rem 1.1rem;
	cursor: pointer;
}

.status-action:hover {
	background: #d6336c;
}

#diag-badge {
	background: rgba(40, 20, 30, 0.82);
	border-radius: 6px;
	color: #ffffff;
	font: 600 11px/1.5 'SFMono-Regular', Menlo, Consolas, monospace;
	left: 4px;
	padding: 4px 7px;
	pointer-events: none;
	position: fixed;
	top: 4px;
	white-space: pre;
	z-index: 99;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
$GODOT_HEAD_INCLUDE

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div class="petal-field" aria-hidden="true">
				<span>🌸</span><span>🌸</span><span>🌺</span><span>🌸</span><span>💗</span><span>🌸</span>
			</div>
			<div class="loading-title">连连看 🎀</div>
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div class="loading-hint">正在准备粉粉的方块…</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = false;
const MOBILE_UA_RE = /Android|iPhone|iPad|iPod|HarmonyOS|Mobile/i;
const IS_MOBILE_DEVICE = MOBILE_UA_RE.test(navigator.userAgent || '');
if (IS_MOBILE_DEVICE) {
	const cores = Math.max(1, Math.min(4, navigator.hardwareConcurrency || 2));
	GODOT_CONFIG.emscriptenPoolSize = Math.max(1, Math.min(2, cores));
	GODOT_CONFIG.godotPoolSize = Math.max(1, Math.min(2, cores));
}
const engine = new Engine(GODOT_CONFIG);

(function () {
	function syncViewportHeight() {
		const nextHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
		document.documentElement.style.setProperty('--app-height', `${Math.round(nextHeight)}px`);
	}

	function applyDprCapForMobile() {
		const params = new URLSearchParams(window.location.search);
		const requested = parseFloat(params.get('dpr') || '');
		const realDpr = window.devicePixelRatio || 1;
		const isMobileUa = /Android|iPhone|iPad|iPod|HarmonyOS/i.test(navigator.userAgent);
		// Some webviews (in-app browsers, home-screen webviews) report dpr=1 on
		// high-density panels, so the canvas renders at CSS resolution and the
		// compositor upscale blurs every glyph. Floor the effective ratio at 2x
		// everywhere, allow native ratios up to 3x on phones, and let ?dpr=N
		// force an exact ratio (e.g. ?dpr=1 for weak low-end devices).
		let ratio;
		if (Number.isFinite(requested) && requested > 0) {
			ratio = requested;
		} else if (isMobileUa) {
			ratio = Math.min(Math.max(realDpr, 2.0), 3.0);
		} else {
			ratio = Math.max(realDpr, 2.0);
		}
		if (Math.abs(ratio - realDpr) < 0.01) {
			return;
		}
		try {
			Object.defineProperty(window, 'devicePixelRatio', {
				configurable: true,
				get: () => ratio,
			});
			console.info(`[H5] effective devicePixelRatio ${realDpr} -> ${ratio}`);
		} catch (err) {
			console.warn('[H5] unable to override devicePixelRatio', err);
		}
	}

	applyDprCapForMobile();

	// ?diag=1 renders a live sharpness badge: the ratio the shell forces, the
	// canvas backing-store size, and the effective render ratio (backing /
	// CSS pixels). effRatio staying at ~1 while dpr says 2+ is the smoking gun
	// for a webview that ignores the devicePixelRatio override.
	(function () {
		if (!new URLSearchParams(window.location.search).has('diag')) {
			return;
		}
		const badge = document.createElement('div');
		badge.id = 'diag-badge';
		document.body.appendChild(badge);
		const canvas = document.getElementById('canvas');
		function refresh() {
			const cssW = canvas.clientWidth || 1;
			const dprEff = canvas.width / cssW;
			badge.textContent =
				`dpr=${window.devicePixelRatio}\n` +
				`canvas=${canvas.width}x${canvas.height}\n` +
				`css=${cssW}x${canvas.clientHeight}\n` +
				`effRatio=${dprEff.toFixed(2)}\n` +
				(Number.isFinite(parseFloat(new URLSearchParams(window.location.search).get('dpr')))
					? `forced dpr=${parseFloat(new URLSearchParams(window.location.search).get('dpr'))}\n` : '') +
				`ua=${/Android|iPhone|iPad/i.test(navigator.userAgent) ? 'mobile' : 'desktop'}`;
		}
		refresh();
		setInterval(refresh, 1000);
		window.addEventListener('resize', refresh, { passive: true });
	})();

	syncViewportHeight();
	window.addEventListener('resize', syncViewportHeight, { passive: true });
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', syncViewportHeight, { passive: true });
	}
	window.addEventListener('orientationchange', () => {
		setTimeout(() => {
			syncViewportHeight();
			window.dispatchEvent(new Event('resize'));
			window.scrollTo(0, 0);
		}, 120);
	}, { passive: true });

	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const canvas = document.getElementById('canvas');

	let initializing = true;
	let statusMode = '';
	let didStartEngine = false;
	let lastProgressAt = Date.now();
	let watchdogTimer = null;

	function setStatusMode(mode) {
		if (mode === 'hidden') {
			if (statusOverlay && statusOverlay.parentNode) {
				statusOverlay.remove();
			}
			initializing = false;
			statusMode = mode;
			// CI smoke hook (?smoke=1): beacon the boot completion so a headless
			// run can verify the engine truly started. No-op in normal play.
			if (window.location.search.indexOf('smoke=1') !== -1) {
				try { navigator.sendBeacon('/smoke-boot-ok'); } catch (err) {}
			}
			return;
		}
		if (statusMode === mode || !initializing) {
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function appendRetryActionButton() {
		const retryButton = document.createElement('button');
		retryButton.type = 'button';
		retryButton.className = 'status-action';
		retryButton.textContent = '刷新重试';
		retryButton.addEventListener('click', () => {
			window.location.reload();
		});
		statusNotice.appendChild(retryButton);
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		appendRetryActionButton();
		setStatusMode('notice');
		initializing = false;
	}

	canvas.addEventListener('webglcontextlost', (event) => {
		event.preventDefault();
		setStatusNotice('图形上下文已丢失，正在等待恢复。若长时间无响应，请刷新页面。');
		appendRetryActionButton();
		setStatusMode('notice');
	});

	canvas.addEventListener('webglcontextrestored', () => {
		setStatusNotice('图形上下文已恢复，正在重新加载游戏。');
		setStatusMode('notice');
		setTimeout(() => {
			window.location.reload();
		}, 280);
	});

	document.addEventListener('visibilitychange', () => {
		if (!document.hidden) {
			syncViewportHeight();
			window.dispatchEvent(new Event('resize'));
		}
	});

	function startLoadWatchdog() {
		const stallThreshold = IS_MOBILE_DEVICE ? 40000 : 55000;
		watchdogTimer = window.setInterval(() => {
			if (!initializing || didStartEngine) {
				return;
			}
			const elapsed = Date.now() - lastProgressAt;
			if (elapsed < stallThreshold) {
				return;
			}
			setStatusNotice('加载时间较长，可能是网络或设备性能限制。请稍后重试。');
			appendRetryActionButton();
			setStatusMode('notice');
			initializing = false;
		}, 3000);
	}

	startLoadWatchdog();

	if (!Engine.isWebGLAvailable()) {
		const iosHint = /iPhone|iPad|iPod/i.test(navigator.userAgent)
			? '\n\niOS 提示:\n1) 请使用 Safari 15+。\n2) 关闭低电量模式后重试。\n3) 若曾添加到桌面，请删除旧快捷方式后重新打开。'
			: '';
		displayFailureNotice('WebGL not available\n当前浏览器不支持 WebGL，无法运行游戏。' + iosHint);
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				lastProgressAt = Date.now();
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			didStartEngine = true;
			if (watchdogTimer !== null) {
				clearInterval(watchdogTimer);
			}
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
