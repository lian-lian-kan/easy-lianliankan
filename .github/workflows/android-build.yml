name: Build Android APK

on:
  push:
    branches: [ main, 'feat/android-apk-ci' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 3.6.2
  GODOT_RELEASE: stable

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary and Android export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_RELEASE }}
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-android-v1

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless editor + Android templates)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux_headless.64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux_headless.64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          # Only the Android template APKs are needed; extract them from the official tpz.
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          TPL="$HOME/.local/share/godot/templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TPL"
          unzip -q -o -j /tmp/templates.tpz \
            "templates/android_debug.apk" \
            "templates/android_release.apk" \
            -d "$TPL"

      - name: Generate debug keystore and inject it into the export preset
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$HOME/android-debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          # The preset ships with empty keystore fields (godot-ci community
          # recipe): fill them in the ephemeral CI checkout only, so the local
          # GUI export flow keeps using the developer's own keystore config.
          sed -i "s@keystore/debug=\".*\"@keystore/debug=\"$HOME/android-debug.keystore\"@" godot/export_presets.cfg
          sed -i 's@keystore/debug_user=".*"@keystore/debug_user="androiddebugkey"@' godot/export_presets.cfg
          sed -i 's@keystore/debug_password=".*"@keystore/debug_password="android"@' godot/export_presets.cfg
          grep -n 'keystore/' godot/export_presets.cfg

      - name: Import project resources
        run: timeout 300 ~/godot-bin/godot --no-window --editor --quit --path godot || true

      - name: Export debug APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          timeout 600 ~/godot-bin/godot --no-window --path godot --export-debug "Android" ../build/android/SophiaLianliankan-debug.apk
          ls -la build/android
          test -s build/android/SophiaLianliankan-debug.apk

      - name: Sanity-check APK contents
        run: |
          set -euo pipefail
          APK=build/android/SophiaLianliankan-debug.apk
          unzip -l "$APK" | grep -E 'AndroidManifest\.xml'
          unzip -l "$APK" | grep -E 'lib/armeabi-v7a|lib/arm64-v8a'
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SophiaLianliankan-debug-${{ github.sha }}
          path: build/android/SophiaLianliankan-debug.apk
          retention-days: 30
