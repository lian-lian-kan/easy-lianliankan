name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GODOT_VERSION: 3.6.2
  GODOT_RELEASE: stable
  # Cloud save is real-network only; CI/headless runs must stay offline.
  LIANLIAN_SYNC: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_RELEASE }}
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-web-v1

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless editor + Web templates)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux_headless.64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux_headless.64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          # Only the Web templates are needed; extract them from the official tpz.
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          TPL="$HOME/.local/share/godot/templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TPL"
          unzip -q -o -j /tmp/templates.tpz \
            "templates/webassembly_release.zip" \
            "templates/webassembly_debug.zip" \
            -d "$TPL"

      - name: Godot headless tests
        run: |
          set -euo pipefail
          G=~/godot-bin/godot
          # Guard against silent hangs: every test file must call quit().
          for t in $(find godot/tests -name '*.gd'); do
            grep -q "quit(" "$t" || { echo "missing quit(): $t"; exit 1; }
          done
          # Godot exits 0 even when a -s script fails to parse, so a broken
          # test file would silently skip itself. Every test run is scanned
          # for parse/runtime errors below. Paths mirror the tests/ domain
          # subdirectories (2026-09-19 分域，见 docs/scaling.md)。
          for t in board/board_engine_test board/board_pathfinder_test board/board_logic_test board/board_fit_test board/path_overlay_input_passthrough_test board/frost_probe board/mechanics_probe session/game_config_test session/progression_test session/achievements_test session/missions_test session/progress_store_test session/server_sync_test session/migration_sync_test session/session_combo_test session/session_settle_test session/session_fail_test session/session_clock_test session/powerup_loadout_test session/revive_test session/game_input_test session/hud_timers_test session/powerups_test session/power_ups_probe interactions/interaction_manager_test modes/tile_match_test modes/memory_flip_test modes/special_session_test modes/special_modes_test modes/campaign_levels_test modes/difficulty_curve_test modes/mode_meta_test modes/level_editor_test modes/tree_ladder_test modes/tree_buffs_test modes/drag_probe modes/tray_probe modes/flip_probe modes/variants_probe ui/ui_style_test ui/fx_layer_test ui/hud_layout_test ui/ui_fonts_test ui/stat_probe ui/panels_probe pages/economy_test pages/page_router_test pages/page_probe pages/startup_probe pages/start_screen_probe content/content_sanity_test content/content_decks_test content/voice_playback_test content/edu_test content/events_calendar_test; do
            echo "== $t"
            rc=0
            out=$(timeout 120 "$G" --no-window --path godot -s "res://tests/${t}.gd" 2>&1) || rc=$?
            if [ "$rc" != "0" ]; then
              echo "$out"
              echo "::error::test $t exited $rc"
              echo "$out" | grep -E "FAIL -|Parse Error|SCRIPT ERROR|ERROR" | head -8 | while IFS= read -r line; do echo "::error::$t >> $line"; done
              exit 1
            fi
            # Godot exits 0 even when a -s script fails to parse — a broken
            # test file must not silently skip itself. Runtime SCRIPT ERRORs
            # are allowed here: fault-tolerance probes trigger them on purpose.
            if echo "$out" | grep -q "Parse Error"; then
              echo "::error::parse errors in ${t}.gd (test silently skipped)"
              echo "$out" | grep "Parse Error" | head -5
              exit 1
            fi
          done
          # Static consistency audit: thin shells, connect targets, orphan
          # shells, Godot 4 syntax leakage (pure text analysis, ~1s).
          echo "== shell_audit"
          (cd godot && python3 tools/shell_audit.py) || { echo "::error::shell_audit failed"; exit 1; }

      - name: Import project resources
        run: timeout 300 ~/godot-bin/godot --no-window --editor --quit --path godot || true

      - name: Export Web build
        run: |
          set -euo pipefail
          mkdir -p public/godot
          timeout 600 ~/godot-bin/godot --no-window --path godot --export "Web" ../public/godot/index.html
          ls -la public/godot
          test -f public/godot/index.wasm
          test -f public/godot/index.pck
          # Bake the deploy hash into the offline-cache manifest and ship it
          # next to the payloads it caches.
          sed "s/__BUILD_HASH__/${GITHUB_SHA::7}/" godot/shell/sw.js > public/godot/sw.js

      - name: Verify web entry
        run: timeout 120 ~/godot-bin/godot --no-window --path godot -s res://tests/web_entry_status_mode_test.gd

      - name: Headless browser smoke
        run: bash tools/ci_smoke.sh "$(pwd)/public/godot"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
