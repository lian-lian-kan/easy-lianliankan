name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GODOT_VERSION: 3.6.2
  GODOT_RELEASE: stable
  # Cloud save is real-network only; CI/headless runs must stay offline.
  LIANLIAN_SYNC: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_RELEASE }}
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-web-v1

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless editor + Web templates)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux_headless.64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux_headless.64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          # Only the Web templates are needed; extract them from the official tpz.
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          TPL="$HOME/.local/share/godot/templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TPL"
          unzip -q -o -j /tmp/templates.tpz \
            "templates/webassembly_release.zip" \
            "templates/webassembly_debug.zip" \
            -d "$TPL"

      - name: Godot headless tests
        run: |
          set -euo pipefail
          G=~/godot-bin/godot
          # Guard against silent hangs: every test file must call quit().
          for t in godot/tests/*.gd; do
            grep -q "quit(" "$t" || { echo "missing quit(): $t"; exit 1; }
          done
          # Godot exits 0 even when a -s script fails to parse, so a broken
          # test file would silently skip itself. Every test run is scanned
          # for parse/runtime errors below.
          for t in board_engine_test board_pathfinder_test board_logic_test board_fit_test game_config_test progression_test achievements_test missions_test tile_match_test memory_flip_test progress_store_test server_sync_test migration_sync_test economy_test content_sanity_test session_combo_test session_settle_test session_fail_test session_clock_test powerup_loadout_test ui_style_test revive_test game_input_test powerups_test special_session_test fx_layer_test hud_layout_test content_decks_test hud_timers_test ui_fonts_test page_router_test tree_ladder_test voice_playback_test edu_test drag_probe tree_buffs_test events_calendar_test level_editor_test path_overlay_input_passthrough_test special_modes_test power_ups_probe frost_probe variants_probe mechanics_probe campaign_levels_test difficulty_curve_test mode_meta_test stat_probe panels_probe page_probe tray_probe flip_probe startup_probe start_screen_probe; do
            echo "== $t"
            out=$(timeout 120 "$G" --no-window --path godot -s "res://tests/${t}.gd" 2>&1) || { echo "$out"; exit 1; }
            # Godot exits 0 even when a -s script fails to parse — a broken
            # test file must not silently skip itself. Runtime SCRIPT ERRORs
            # are allowed here: fault-tolerance probes trigger them on purpose.
            if echo "$out" | grep -q "Parse Error"; then
              echo "::error::parse errors in ${t}.gd (test silently skipped)"
              echo "$out" | grep "Parse Error" | head -5
              exit 1
            fi
          done
          # Static consistency audit: thin shells, connect targets, orphan
          # shells, Godot 4 syntax leakage (pure text analysis, ~1s).
          echo "== shell_audit"
          (cd godot && python3 tools/shell_audit.py)

      - name: Import project resources
        run: timeout 300 ~/godot-bin/godot --no-window --editor --quit --path godot || true

      - name: Export Web build
        run: |
          set -euo pipefail
          mkdir -p public/godot
          timeout 600 ~/godot-bin/godot --no-window --path godot --export "Web" ../public/godot/index.html
          ls -la public/godot
          test -f public/godot/index.wasm
          test -f public/godot/index.pck
          # Bake the deploy hash into the offline-cache manifest and ship it
          # next to the payloads it caches.
          sed "s/__BUILD_HASH__/${GITHUB_SHA::7}/" godot/shell/sw.js > public/godot/sw.js

      - name: Verify web entry
        run: timeout 120 ~/godot-bin/godot --no-window --path godot -s res://tests/web_entry_status_mode_test.gd

      - name: Headless browser smoke
        run: bash tools/ci_smoke.sh "$(pwd)/public/godot"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
